name: Bug Report
description: Report a bug or error in a coatless-wasm project
title: "[BUG] "
labels: [bug, needs-triage]
type: Bug
assignees: [coatless]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Our projects are maintained by volunteers, so while we appreciate your report, we cannot guarantee how quickly it will be addressed.

  - type: input
    id: version
    attributes:
      label: Package Version
      placeholder: e.g., 0.1.1
    validations:
      required: true
  - type: input
    id: language-version
    attributes:
      label: R or Python Version
      placeholder: e.g., R 4.5.1
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Problem Area
      description: The step where the problem appears
      options:
        - Building a site
        - Previewing a site locally
        - Using a built site in the browser
        - Deploying a site
        - Documentation
        - Other
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: Only for a problem in the browser
      options:
        - Chrome
        - Edge
        - Firefox
        - Safari
        - Other
  - type: input
    id: browser-version
    attributes:
      label: Browser Version
      placeholder: e.g., 143
  - type: dropdown
    id: host
    attributes:
      label: Site Host
      description: Only for a problem in the browser, where the site is served from
      options:
        - Local preview
        - GitHub Pages
        - Netlify
        - Cloudflare Pages
        - Other
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Minimal reproducible example, with the call that failed and its full message
      placeholder: |
        ```r
        library(webrarian)
        # Code that reproduces the issue
        ```
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Output from `webrarian::diagnose_collection()` (or `pyodidarian diagnose-collection`) run in your collection and, for a problem in the browser, the errors in the browser's console
      render: text
  - type: textarea
    id: configuration
    attributes:
      label: Configuration
      description: Your `_webrarian.yml` (or `_pyodidarian.yml`)
      render: yaml
